<title>Kasey &amp; Willem — Wedding Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16161A;
    --ink-soft: #6E6E73;
    --ink-faint: #A1A1A6;
    --line: #E8E8EA;
    --bg: #FFFFFF;
    --gap: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* ---------- Sticky bar ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem clamp(1rem, 4vw, 2.5rem);
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid transparent;
    transform: translateY(-100%);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), border-color 0.4s;
  }

  .topbar.visible { transform: translateY(0); border-bottom-color: var(--line); }

  .topbar .names {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Hero banner ---------- */
  .hero {
    position: relative;
    width: 100%;
    height: clamp(300px, 52vh, 560px);
    overflow: hidden;
    background: #EDEDEF;
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 48%;
    display: block;
    opacity: 0;
    transform: scale(1.06);
    transition: opacity 1.2s ease, transform 1.6s cubic-bezier(0.16,1,0.3,1);
  }

  .hero img.loaded { opacity: 1; transform: scale(1); }

  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.06) 100%);
    pointer-events: none;
  }

  /* ---------- Title block ---------- */
  .titleblock {
    text-align: center;
    padding: clamp(2.5rem, 6vw, 4.5rem) 1.5rem clamp(2rem, 5vw, 3.5rem);
    animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) both;
    animation-delay: 0.15s;
  }

  .eyebrow {
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 1.4rem;
  }

  h1 {
    font-size: clamp(1.75rem, 5.5vw, 3.4rem);
    font-weight: 200;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.15;
    margin-bottom: 1.4rem;
  }

  h1 .amp {
    font-weight: 200;
    opacity: 0.4;
    margin: 0 0.15em;
  }

  .rule {
    width: 44px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 1.3rem;
  }

  .count {
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 2rem;
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.7rem 1.5rem;
    border-radius: 980px;
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
    white-space: nowrap;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #3A3A40; }

  .btn-sm { padding: 0.5rem 1.05rem; font-size: 0.7rem; }

  /* ---------- Masonry ---------- */
  .gallery {
    padding: 0 var(--gap) clamp(3rem, 7vw, 5rem);
    max-width: 1800px;
    margin: 0 auto;
  }

  .masonry {
    display: flex;
    align-items: flex-start;
    gap: var(--gap);
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    flex: 1 1 0;
    min-width: 0;
  }

  .tile {
    position: relative;
    width: 100%;
    background: #F0F0F2;
    overflow: hidden;
    cursor: pointer;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.16,1,0.3,1);
  }

  .tile.shown { opacity: 1; transform: none; }

  .tile img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 0.7s cubic-bezier(0.16,1,0.3,1), filter 0.4s ease;
  }

  @media (hover: hover) {
    .tile:hover img { transform: scale(1.035); filter: brightness(0.96); }
  }

  /* ---------- Lightbox ---------- */
  .lb {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(14,14,16,0.97);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .lb.active { display: flex; }
  .lb.shown { opacity: 1; }

  .lb-stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4.5rem 1rem 5rem;
  }

  .lb-stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.3s ease;
    user-select: none;
    -webkit-user-drag: none;
  }

  .lb-stage img.ready { opacity: 1; }

  .lb-spinner {
    position: absolute;
    width: 26px; height: 26px;
    border: 2px solid rgba(255,255,255,0.18);
    border-top-color: rgba(255,255,255,0.75);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .lb-spinner.on { opacity: 1; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .lb-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem clamp(1rem, 3vw, 1.75rem);
    padding-top: calc(1rem + env(safe-area-inset-top));
    z-index: 5;
  }

  .lb-counter {
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.55);
    font-variant-numeric: tabular-nums;
  }

  .lb-actions { display: flex; gap: 0.5rem; align-items: center; }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    border: none;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease;
    flex-shrink: 0;
  }

  .icon-btn:hover { background: rgba(255,255,255,0.2); }
  .icon-btn:active { transform: scale(0.92); }

  .lb-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px; height: 46px;
    font-size: 1.4rem;
    z-index: 5;
  }

  .lb-prev { left: clamp(0.5rem, 2vw, 1.5rem); }
  .lb-next { right: clamp(0.5rem, 2vw, 1.5rem); }

  .lb-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1rem;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    z-index: 5;
  }

  .lb-dl {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  .lb-dl:hover { background: rgba(255,255,255,0.22); }

  @media (max-width: 700px) {
    .lb-arrow { display: none; }
    .lb-bottom { display: flex; }
    .lb-stage { padding: 4rem 0.5rem 5rem; }
  }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    padding: clamp(2.5rem, 6vw, 4rem) 1.5rem clamp(3rem, 6vw, 4rem);
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  footer a { color: var(--ink-soft); text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: var(--ink); }

  .footer-cta { margin-bottom: 2rem; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    .tile { opacity: 1; transform: none; }
    .hero img { opacity: 1; transform: none; }
  }
</style>
</head>

const thumb = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const dl = id => `https://drive.google.com/uc?export=download&id=${id}`;

/* ---- links ---- */
['topDrive','mainDrive','footDrive'].forEach(id => { document.getElementById(id).href = DRIVE_FOLDER; });
document.getElementById('countLabel').textContent = `${PHOTOS.length} photographs`;

/* ---- hero ---- */
const heroImg = document.getElementById('heroImg');
heroImg.onload = () => heroImg.classList.add('loaded');
heroImg.src = thumb(HERO_ID, 2000);

/* ---- sticky bar ---- */
const topbar = document.getElementById('topbar');
let lastY = 0;
addEventListener('scroll', () => {
  const y = scrollY;
  if (y > 420) topbar.classList.add('visible');
  else topbar.classList.remove('visible');
  lastY = y;
}, {passive: true});

/* ---- masonry ---- */
const masonry = document.getElementById('masonry');
const reveal = new IntersectionObserver((entries, obs) => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('shown'); obs.unobserve(e.target); }
  });
}, {rootMargin: '200px 0px'});

function colCount() {
  const w = innerWidth;
  if (w < 640) return 1;
  if (w < 1000) return 2;
  if (w < 1500) return 3;
  return 4;
}

let currentCols = 0;

function build() {
  const n = colCount();
  if (n === currentCols) return;
  currentCols = n;
  masonry.innerHTML = '';

  const cols = [];
  const heights = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'col';
    masonry.appendChild(c);
    cols.push(c);
  }

  // width each column will render at (approx) — only ratios matter for balancing
  PHOTOS.forEach(([id, name, w, h], i) => {
    const ratio = h / w;                       // normalized height for unit width
    let target = 0;
    for (let c = 1; c < n; c++) if (heights[c] < heights[target]) target = c;

    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.aspectRatio = `${w} / ${h}`;
    tile.dataset.index = i;

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = `Kasey and Willem wedding photo ${i + 1}`;
    img.src = thumb(id, n === 1 ? 1000 : 800);
    img.width = w;
    img.height = h;

    tile.appendChild(img);
    tile.addEventListener('click', () => openLb(i));
    cols[target].appendChild(tile);
    reveal.observe(tile);

    heights[target] += ratio;
  });
}

build();

let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(build, 180);
});

/* ---- lightbox ---- */
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbSpin = document.getElementById('lbSpin');
const lbCounter = document.getElementById('lbCounter');
const lbDownload = document.getElementById('lbDownload');
let idx = 0;
let scrollLock = 0;

function openLb(i) {
  idx = i;
  scrollLock = scrollY;
  lb.classList.add('active');
  requestAnimationFrame(() => lb.classList.add('shown'));
  document.body.style.position = 'fixed';
  document.body.style.top = `-${scrollLock}px`;
  document.body.style.width = '100%';
  render();
  addEventListener('keydown', keys);
}

function closeLb() {
  lb.classList.remove('shown');
  removeEventListener('keydown', keys);
  setTimeout(() => {
    lb.classList.remove('active');
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    scrollTo(0, scrollLock);
  }, 250);
}

function nav(d) { idx = (idx + d + PHOTOS.length) % PHOTOS.length; render(); }

function render() {
  const [id, name] = PHOTOS[idx];
  lbImg.classList.remove('ready');
  lbSpin.classList.add('on');
  lbImg.onload = () => { lbImg.classList.add('ready'); lbSpin.classList.remove('on'); };
  lbImg.src = thumb(id, 2000);
  lbImg.alt = `Kasey and Willem wedding photo ${idx + 1}`;
  lbCounter.textContent = `${idx + 1} / ${PHOTOS.length}`;
  lbDownload.href = dl(id);
  // preload neighbours
  [1, -1].forEach(d => {
    const nb = PHOTOS[(idx + d + PHOTOS.length) % PHOTOS.length];
    new Image().src = thumb(nb[0], 2000);
  });
}

function keys(e) {
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowRight') nav(1);
  else if (e.key === 'ArrowLeft') nav(-1);
}

document.getElementById('lbClose').onclick = closeLb;
document.getElementById('lbPrev').onclick = () => nav(-1);
document.getElementById('lbNext').onclick = () => nav(1);
document.getElementById('lbPrevM').onclick = () => nav(-1);
document.getElementById('lbNextM').onclick = () => nav(1);

lb.addEventListener('click', e => {
  if (e.target === lb || e.target.classList.contains('lb-stage')) closeLb();
});

/* swipe */
let sx = 0, sy = 0;
lb.addEventListener('touchstart', e => {
  sx = e.changedTouches[0].screenX;
  sy = e.changedTouches[0].screenY;
}, {passive: true});

lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - sx;
  const dy = e.changedTouches[0].screenY - sy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) nav(dx > 0 ? -1 : 1);
  else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeLb();
}, {passive: true});
</script>
