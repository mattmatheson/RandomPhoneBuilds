<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="published" content="2026-10-13">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abby &mdash; Wedding Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: #FFFFFF;
    color: #1D1D1F;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: clamp(3rem, 8vw, 6rem) clamp(1.25rem, 4vw, 2rem) 4rem;
  }

  header {
    margin-bottom: 4rem;
    animation: fadeIn 0.6s ease-out both;
  }

  .label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #86868B;
    margin-bottom: 0.75rem;
    display: block;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin-bottom: 0.4rem;
  }

  .meta {
    font-size: 0.95rem;
    font-weight: 400;
    color: #6E6E73;
  }

  .actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.65rem 1.4rem;
    border-radius: 980px;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
  }

  .btn-primary {
    background: #1D1D1F;
    color: #FFFFFF;
  }

  .btn-primary:hover {
    background: #424245;
  }

  .btn-outline {
    background: transparent;
    color: #1D1D1F;
    border: 1px solid #D2D2D7;
  }

  .btn-outline:hover {
    background: #F5F5F7;
  }

  .info-box {
    background: #F5F5F7;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin: 0 0 2rem;
    font-size: 0.82rem;
    color: #424245;
    line-height: 1.7;
  }
  .info-box strong { color: #1D1D1F; }
  .info-box .credit {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid #E5E5E7;
    font-size: 0.78rem;
    color: #6E6E73;
  }

  .divider {
    height: 1px;
    background: #E5E5E7;
    margin-bottom: 3rem;
  }

  .feed {
    display: flex;
    flex-direction: column;
    gap: clamp(1.5rem, 4vw, 2.75rem);
  }

  .feed-item {
    animation: fadeIn 0.5s ease-out both;
    background: #FFFFFF;
    padding: clamp(12px, 3.5vw, 32px);
    border: 1px solid #E8E8ED;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
  }

  .feed-item img {
    width: 100%;
    height: auto;
    display: block;
    cursor: pointer;
    transition: opacity 0.3s ease;
  }

  .feed-item img:hover {
    opacity: 0.92;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.15s ease-out;
  }

  .lightbox.active { display: flex; }

  .lightbox img {
    max-width: 92vw;
    max-height: calc(100vh - 120px);
    object-fit: contain;
  }

  .lightbox-close {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    border: none;
    color: #1D1D1F;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    z-index: 10;
  }

  .lightbox-close:hover { background: rgba(0,0,0,0.1); }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    border: none;
    color: #1D1D1F;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    z-index: 10;
  }

  .lightbox-nav:hover { background: rgba(0,0,0,0.1); }
  .lightbox-prev { left: 1rem; }
  .lightbox-next { right: 1rem; }

  .lightbox-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .lightbox-bottom .lb-nav-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    border: none;
    color: #1D1D1F;
    font-size: 1.3rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .lightbox-counter {
    color: #86868B;
    font-size: 0.75rem;
    font-weight: 500;
    flex: 1;
    text-align: center;
  }

  @media (max-width: 600px) {
    .lightbox-nav { display: none; }
    .lightbox-bottom .lb-nav-btn { display: flex; }
    .lightbox img { max-height: calc(100vh - 140px); }
  }

  footer {
    text-align: center;
    padding: 3rem 0 2rem;
    color: #86868B;
    font-size: 0.7rem;
    font-weight: 400;
  }

  footer a {
    color: #86868B;
    text-decoration: none;
  }

  footer a:hover { color: #1D1D1F; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 600px) {
    .container { padding-left: 0; padding-right: 0; }
    header { padding: 0 1.25rem; }
    .divider { margin-left: 1.25rem; margin-right: 1.25rem; }
    .info-box { margin-left: 1.25rem; margin-right: 1.25rem; }
    footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    .feed { gap: 1.25rem; padding: 0 1.25rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="label">Wedding Photography</span>
    <h1>Abby&rsquo;s Wedding</h1>
    <p class="meta">Sneak peek &mdash; October 2026</p>
  </header>

  <div class="info-box">
    These aren&rsquo;t final.
  </div>

  <div class="divider"></div>

  <div class="feed" id="feed"></div>

  <footer>
    <p>Photos by <a href="https://mattmatheson.github.io/RandomPhoneBuilds/">Matt Matheson</a></p>
  </footer>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">&#8249;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">&#8250;</button>
  <div class="lightbox-bottom">
    <button class="lb-nav-btn" onclick="navLightbox(-1)">&#8249;</button>
    <div class="lightbox-counter" id="lightboxCounter"></div>
    <button class="lb-nav-btn" onclick="navLightbox(1)">&#8250;</button>
  </div>
</div>

<script>
const photos = [
  { name: "01.jpg", id: "1Xuy_pEy6eXFn2vg9a6-8z8G-USQWcmbk" },
  { name: "02.jpg", id: "1qsbPp_l0XgNwMhadaAKiwq5roUAu9Czb" },
  { name: "03.jpg", id: "1aU2MBfYvimYVvqL3MHBFeLEyLVPh4VSF" },

  { name: "07.jpg", id: "14eUMS_Zg355XxvxowFMRTuVKDdzsFRw8" },
  { name: "08.jpg", id: "1hvoxA2tTBTBNOiQiHm_NdwBTakQNxVHo" },

  { name: "15.jpg", id: "1B3nPhCiik3kMBXnEBDIsCT_xmiqxgave" },
  { name: "16.jpg", id: "1oXtqwcCMw-yUvhg5XgayFYo9YxBWHZRu" },

  { name: "38.jpg", id: "1c66VCpoyBEQZykrPN-zMdEyHQ0-MEvXp" }
];

function thumb(id, w) {
  return `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
}

const feed = document.getElementById('feed');
let currentIndex = 0;

photos.forEach((photo, i) => {
  const item = document.createElement('div');
  item.className = 'feed-item';
  item.style.animationDelay = `${i * 0.05}s`;
  item.innerHTML = `<img src="${thumb(photo.id, 1400)}" alt="${photo.name}" loading="lazy">`;
  item.querySelector('img').onclick = () => openLightbox(i);
  feed.appendChild(item);
});

function openLightbox(index) {
  currentIndex = index;
  document.getElementById('lightbox').classList.add('active');
  updateLightbox();
  document.addEventListener('keydown', handleKeys);
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.removeEventListener('keydown', handleKeys);
}

function navLightbox(dir) {
  currentIndex = (currentIndex + dir + photos.length) % photos.length;
  updateLightbox();
}

function updateLightbox() {
  const img = document.getElementById('lightboxImg');
  img.src = thumb(photos[currentIndex].id, 2000);
  img.alt = photos[currentIndex].name;
  document.getElementById('lightboxCounter').textContent = `${currentIndex + 1} / ${photos.length}`;
}

function handleKeys(e) {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') navLightbox(1);
  if (e.key === 'ArrowLeft') navLightbox(-1);
}

document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeLightbox();
});

// Swipe support for mobile
let touchStartX = 0;
const lbEl = document.getElementById('lightbox');
lbEl.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
lbEl.addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 50) { navLightbox(diff > 0 ? -1 : 1); }
}, {passive: true});
</script>
</body>
</html>
