  }

    margin-bottom: 0.75rem;
    display: block;
  }

  h1 {

    letter-spacing: -0.025em;
    line-height: 1.1;
    margin-bottom: 0.4rem;
  }

  .meta {
    font-size: 0.95rem;
    font-weight: 400;
    color: #6E6E73;
  }

  .actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.65rem 1.4rem;
    border-radius: 980px;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
  }

  .btn-primary {
    background: #1D1D1F;
    color: #FFFFFF;
  }

  .btn-primary:hover {
    background: #424245;
  }

  .btn-outline {
    background: transparent;
    color: #1D1D1F;
    border: 1px solid #D2D2D7;
  }

  .btn-outline:hover {
    background: #F5F5F7;
  }

  .divider {
    height: 1px;
    background: #E5E5E7;
    margin-bottom: 3rem;
  }

  .feed {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .feed-item {
    animation: fadeIn 0.5s ease-out both;
  }

  .feed-item img {
    width: 100%;
    height: auto;
    display: block;
    cursor: pointer;
    transition: opacity 0.3s ease;
  }

  .feed-item img:hover {
    opacity: 0.92;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.15s ease-out;
  }

  .lightbox.active { display: flex; }

  .lightbox img {
    max-width: 92vw;
    max-height: calc(100vh - 120px);
    object-fit: contain;
  }

  .lightbox-close {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    border: none;
    color: #1D1D1F;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    z-index: 10;
  }

  .lightbox-close:hover { background: rgba(0,0,0,0.1); }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    border: none;
    color: #1D1D1F;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    z-index: 10;
  }

  .lightbox-nav:hover { background: rgba(0,0,0,0.1); }
  .lightbox-prev { left: 1rem; }
  .lightbox-next { right: 1rem; }

  .lightbox-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .lightbox-bottom .lb-nav-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    border: none;
    color: #1D1D1F;
    font-size: 1.3rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .lightbox-counter {
    color: #86868B;
    font-size: 0.75rem;
    font-weight: 500;
    flex: 1;
    text-align: center;
  }

  @media (max-width: 600px) {
    .lightbox-nav { display: none; }
    .lightbox-bottom .lb-nav-btn { display: flex; }
    .lightbox img { max-height: calc(100vh - 140px); }
  }

  footer {
    text-align: center;
    padding: 3rem 0 2rem;
    color: #86868B;
    font-size: 0.7rem;
    font-weight: 400;
  }

  footer a {
    color: #86868B;
    text-decoration: none;
  }

  footer a:hover { color: #1D1D1F; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 600px) {
    .container { padding-left: 0; padding-right: 0; }
    header { padding: 0 1.25rem; }
    .divider { margin-left: 1.25rem; margin-right: 1.25rem; }
    footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    .feed { gap: 1px; }
  }
</style>

function thumb(id, w) {
  return `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
}

const feed = document.getElementById('feed');
let currentIndex = 0;

photos.forEach((photo, i) => {
  const item = document.createElement('div');
  item.className = 'feed-item';
  item.style.animationDelay = `${i * 0.05}s`;
  item.innerHTML = `<img src="${thumb(photo.id, 1400)}" alt="${photo.name}" loading="lazy">`;
  item.querySelector('img').onclick = () => openLightbox(i);
  feed.appendChild(item);
});

function openLightbox(index) {
  currentIndex = index;
  document.getElementById('lightbox').classList.add('active');
  updateLightbox();
  document.addEventListener('keydown', handleKeys);
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.removeEventListener('keydown', handleKeys);
}

function navLightbox(dir) {
  currentIndex = (currentIndex + dir + photos.length) % photos.length;
  updateLightbox();
}

function updateLightbox() {
  const img = document.getElementById('lightboxImg');
  img.src = thumb(photos[currentIndex].id, 2000);
  img.alt = photos[currentIndex].name;
  document.getElementById('lightboxCounter').textContent = `${currentIndex + 1} / ${photos.length}`;
}

function handleKeys(e) {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') navLightbox(1);
  if (e.key === 'ArrowLeft') navLightbox(-1);
}

document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeLightbox();
});

// Swipe support for mobile
let touchStartX = 0;
const lbEl = document.getElementById('lightbox');
lbEl.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
lbEl.addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 50) { navLightbox(diff > 0 ? -1 : 1); }
}, {passive: true});
</script>
